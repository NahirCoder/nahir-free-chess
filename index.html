<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nahir Free Chess</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
<section id="home" class="screen">
  <div class="home-glow"></div>
  <div class="card home-card">
    <div class="home-mark"><span>♔</span><i></i></div>
    <div class="eyebrow">TWO PLAYERS · ONE COMPUTER</div>
    <h1>Nahir Free Chess</h1>
    <p>A clean, classic chess board built for two players.</p>
    <button id="newGame" class="primary-button"><span>Load New Game</span><b>→</b></button>
    <div class="home-detail"><span>♟</span><span>Local pass-and-play</span><span>♟</span></div>
  </div>
</section>
<section id="game" class="screen hidden">
<header class="topbar"><div><strong>Nahir Free Chess</strong><span id="turnText">White to move</span></div><button id="restart">New Game</button></header>
<div class="game-layout"><div class="board-wrap"><div id="board" aria-label="Chess board"></div><div class="game-controls"><button id="resign" class="resign">Resign</button></div></div>
<aside class="panel"><div id="status" class="status">White to move</div><div id="message" class="message">Select a piece to see its legal moves.</div><div class="moves-title">Moves</div><ol id="moves" class="moves"></ol></aside></div>
</section>
</main>
<div id="resultModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="resultTitle"><div class="result-card"><div id="resultIcon" class="result-icon">♔</div><h2 id="resultTitle">White wins</h2><p id="resultReason">by checkmate</p><button id="modalNewGame">New Game</button></div></div>
<script type="module" src="script.js"></script>
</body>
</html>
